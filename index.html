<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GMP PRODAMU</title>
    <meta name="description" content="Prontuário Guardiã Maria da Penha — acesso institucional" />
    <meta name="theme-color" content="#1B3A6B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GMP PRODAMU" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="GMP PRODAMU" />
    <meta property="og:title" content="GMP PRODAMU" />
    <meta property="og:description" content="Sistema Guardiã Maria da Penha — PRODAMU" />
    <meta property="og:image" content="https://gmpprodamu-glitch.github.io/gmp-prodamu/og-image.png" />
    <style>
      :root {
        --gmp-blue: #1b3a6b;
        --bg: #f4f6fa;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; min-height: 100vh; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(900px 420px at 85% -10%, rgba(209, 91, 138, 0.10), transparent 60%),
          radial-gradient(800px 380px at -10% 0%, rgba(27, 58, 107, 0.10), transparent 55%),
          var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(20, 32, 58, 0.14);
        padding: 34px 26px 28px;
        text-align: center;
      }
      .crest { width: 110px; height: 110px; object-fit: contain; margin: 0 auto 14px; display: block; }
      h1 { margin: 0; font-size: 26px; letter-spacing: 0.04em; color: #1b1f26; }
      .sub { margin: 4px 0 2px; font-size: 15px; color: var(--gmp-blue); font-weight: 600; }
      .desc { margin: 0 0 24px; font-size: 13px; color: #5a6472; }
      .btn {
        display: block;
        width: 100%;
        padding: 15px 16px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        margin: 10px 0;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .btn:active { transform: scale(0.98); }
      .btn-primary {
        color: #fff;
        background: linear-gradient(120deg, #1b3a6b 0%, #2f5b9e 55%, #8e244d 135%);
        box-shadow: 0 10px 24px rgba(27, 58, 107, 0.28);
      }
      .btn-secondary {
        color: #1b3a6b;
        background: #eef2f9;
        border: 1px solid #d4dce8;
      }
      .btn-install {
        color: #8e244d;
        background: #fdf1f5;
        border: 1px solid #e8b9c8;
      }
      .hidden { display: none !important; }
      .hint { margin: 16px 0 0; font-size: 12px; color: #5a6472; }
      .hint.small { margin-top: 8px; font-size: 11px; color: #8a94a3; }
      .ios-step { display: block; margin: 2px 0; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="icon-192.png" alt="Brasão PRODAMU" class="crest" width="110" height="110" />
      <h1>GMP PRODAMU</h1>
      <p class="sub">Prontuário Guardiã Maria da Penha</p>
      <p class="desc">Acesso institucional</p>
      <a
        class="btn btn-primary"
        id="entrar"
        href="https://apps.powerapps.com/play/e/69d66729-9a82-e2ab-b79b-65bfa9cc1ce8/app/37e0c391-9ece-478f-918e-57d0c05ca2c7?tenantId=90dd5b64-e710-4d3f-bbec-59427ccb45a9&hideNavBar=true"
        rel="noopener"
        >ENTRAR NO GMP</a
      >
      <button class="btn btn-install hidden" id="instalar" type="button">INSTALAR GMP</button>
      <a
        class="btn btn-secondary"
        id="trocar"
        href="https://login.microsoftonline.com/90dd5b64-e710-4d3f-bbec-59427ccb45a9/oauth2/v2.0/logout?post_logout_redirect_uri=https%3A%2F%2Fgmpprodamu-glitch.github.io%2Fgmp-prodamu%2F"
        rel="noopener"
        >TROCAR CONTA MICROSOFT</a
      >
      <p class="hint">Use sua conta institucional autorizada.</p>
      <p class="hint small hidden" id="ios-hint">
        No iPhone, toque em Compartilhar <span class="ios-step">→</span> Adicionar à Tela de Início para
        instalar o GMP PRODAMU.
      </p>
    </main>
    <script>
      // Único destino de execução: player oficial do Code App (nunca o Maker Portal).
      const REAL_PLAY_URL =
        "https://apps.powerapps.com/play/e/69d66729-9a82-e2ab-b79b-65bfa9cc1ce8/app/37e0c391-9ece-478f-918e-57d0c05ca2c7?tenantId=90dd5b64-e710-4d3f-bbec-59427ccb45a9&hideNavBar=true";

      const entrar = document.getElementById("entrar");
      const instalarBtn = document.getElementById("instalar");
      const iosHint = document.getElementById("ios-hint");

      if (entrar.href.indexOf("make.powerapps.com") !== -1) {
        entrar.setAttribute("href", REAL_PLAY_URL);
      }

      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const launchedFromPwa = new URLSearchParams(window.location.search).get("launch") === "1";

      if (isStandalone || isIOS) {
        instalarBtn.classList.add("hidden");
      }
      if (isIOS && !isStandalone) {
        iosHint.classList.remove("hidden");
      }

      let deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        if (!isStandalone) instalarBtn.classList.remove("hidden");
      });

      instalarBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        instalarBtn.classList.add("hidden");
      });

      window.addEventListener("appinstalled", () => {
        instalarBtn.classList.add("hidden");
      });

      // Ícone instalado (PWA) → vai direto ao runtime do GMP.
      if (launchedFromPwa) {
        window.location.replace(REAL_PLAY_URL);
      }

      // Service worker: cache SOMENTE assets estáticos da landing (sem dados do GMP).
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
